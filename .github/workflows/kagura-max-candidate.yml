name: Kagura MAX Candidate - LLVM19 Pass Lab (Experimental)

# Manual-only, separate plugin/fixture. Never changes Crane production.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kagura-max-candidate:
    runs-on: macos-14
    timeout-minutes: 85
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify Kagura MAX candidate scope and test contracts
        run: |
          set -euo pipefail
          python3 scripts/test_kagura_max_candidate.py
          python3 scripts/test_kagura_k1_stages.py
          python3 scripts/test_kagura_scope_bench.py
          python3 scripts/test_kagura_interleaved_bench.py
          python3 scripts/test_kagura_ios_ipa.py
          python3 scripts/test_custom_ollvm_pass_matrix.py

      - name: Compile pinned MIT Kagura plugin with LLVM 19
        run: |
          set -euo pipefail
          brew install llvm@19 cmake ninja
          llvm="$(brew --prefix llvm@19)"
          echo "KAGURA_LLVM=$llvm" >> "$GITHUB_ENV"
          src="$RUNNER_TEMP/kagura-source"
          pin="ac2136ee0408677cf7cdee55307e9b16edd5f4d5"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/qusamulab/kagura.git
          git -C "$src" fetch --depth 1 origin "$pin"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$pin"
          test -s "$src/LICENSE"
          cmake -S "$src" -B "$RUNNER_TEMP/kagura-build" -G Ninja \
            -DLLVM_DIR="$llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="$llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" \
            -DKAGURA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/kagura-build" --parallel 3
          plugin="$(find "$RUNNER_TEMP/kagura-build" -type f \
            \( -name KaguraObfuscator.dylib -o -name KaguraObfuscator.so \) -print -quit)"
          test -n "$plugin" && test -s "$plugin"
          echo "KAGURA_PLUGIN=$plugin" >> "$GITHUB_ENV"

      - name: Native LLVM19 IR passes + same-compiler 8192 output comparison
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/scripts/custom_ollvm/kagura_max"
          out="$dir/out"
          mkdir -p "$out"
          echo "KAGURA_OUT=$out" >> "$GITHUB_ENV"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          "$KAGURA_LLVM/bin/clang" -O1 -std=c11 -Wall -Wextra -Werror \
            -isysroot "$sdk" -emit-llvm -c "$dir/critical.c" -o "$out/host-plain.bc"
          # LLVM19 clang parses -mllvm before loading -fpass-plugin. Use opt.
          "$KAGURA_LLVM/bin/opt" --load-pass-plugin="$KAGURA_PLUGIN" \
            -passes='kagura-str,function(kagura-fla,kagura-bcf,kagura-sub,kagura-co)' \
            "$out/host-plain.bc" -o "$out/host-candidate.bc" \
            2>&1 | tee "$out/host-pass.log"
          "$KAGURA_LLVM/bin/llvm-dis" "$out/host-plain.bc" -o "$out/host-plain.ll"
          "$KAGURA_LLVM/bin/llvm-dis" "$out/host-candidate.bc" -o "$out/host-candidate.ll"
          "$KAGURA_LLVM/bin/clang" -O0 -c "$out/host-plain.bc" -o "$out/host-plain.o"
          "$KAGURA_LLVM/bin/clang" -O0 -c "$out/host-candidate.bc" -o "$out/host-candidate.o"
          xcrun clang -O1 -std=c11 -Wall -Wextra -Werror \
            -c "$dir/runner.c" -o "$out/runner.o"
          "$KAGURA_LLVM/bin/clang" -O1 -std=c11 -Wall -Wextra -Werror \
            -isysroot "$sdk" -c "$dir/sentinel.c" -o "$out/sentinel-plain.o"
          xcrun clang -O2 -std=c11 -Wall -Wextra -Werror \
            -c "$dir/bench_runner.c" -o "$out/bench-runner.o"
          xcrun clang "$out/host-plain.o" "$out/runner.o" -o "$out/host-plain"
          xcrun clang "$out/host-candidate.o" "$out/runner.o" -o "$out/host-candidate"
          "$out/host-plain" > "$out/host-plain.log"
          "$out/host-candidate" > "$out/host-candidate.log"
          cmp "$out/host-plain.log" "$out/host-candidate.log"

      - name: K1 inspect each real Kagura pass and compare 8192 host results
        run: |
          set -euo pipefail
          python3 scripts/custom_ollvm/kagura_max/stage_pipeline.py \
            --llvm "$KAGURA_LLVM" \
            --plugin "$KAGURA_PLUGIN" \
            --plain-bc "$KAGURA_OUT/host-plain.bc" \
            --baseline-log "$KAGURA_OUT/host-plain.log" \
            --runner-obj "$KAGURA_OUT/runner.o" \
            --sentinel-obj "$KAGURA_OUT/sentinel-plain.o" \
            --benchmark-obj "$KAGURA_OUT/bench-runner.o" \
            --out "$KAGURA_OUT/stages"
          python3 scripts/custom_ollvm/kagura_max/benchmark_audit.py \
            --baseline "$KAGURA_OUT/stages/stage00-baseline-bench.log" \
            --stages "$KAGURA_OUT/stages" \
            --out "$KAGURA_OUT/stages/kagura-k1-host-benchmark.json"
          cat "$KAGURA_OUT/stages/kagura-k1-stage-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: K3 counterbalanced host performance across all Kagura stages
        run: |
          set -euo pipefail
          python3 scripts/custom_ollvm/kagura_max/interleaved_benchmark.py \
            --stages "$KAGURA_OUT/stages" \
            --logs "$KAGURA_OUT/stages/interleaved" \
            --out "$KAGURA_OUT/stages/kagura-k3-host-interleaved.json"
          python3 scripts/custom_ollvm/kagura_max/interleaved_benchmark.py \
            --verify-only \
            --logs "$KAGURA_OUT/stages/interleaved" \
            --out "$KAGURA_OUT/stages/kagura-k3-host-reverified.json"
          python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["KAGURA_OUT"])/"stages"; a=json.loads((p/"kagura-k3-host-interleaved.json").read_text()); b=json.loads((p/"kagura-k3-host-reverified.json").read_text()); assert a["raw_rounds"] == b["raw_rounds"] and a["variants"][0]["pooled_median_ns_per_call"] == b["variants"][0]["pooled_median_ns_per_call"]'
          echo "Kagura K3 host counterbalanced 16 rounds: parsed; results in artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Cross-compile iOS arm64 and independently check Apple arm64e ABI
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/scripts/custom_ollvm/kagura_max"
          out="$KAGURA_OUT"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          "$KAGURA_LLVM/bin/clang" -O1 -std=c11 -Wall -Wextra -Werror \
            -target arm64-apple-ios15.0 -isysroot "$sdk" \
            -emit-llvm -c "$dir/critical.c" -o "$out/ios-plain.bc"
          "$KAGURA_LLVM/bin/opt" --load-pass-plugin="$KAGURA_PLUGIN" \
            -passes='kagura-str,function(kagura-fla,kagura-bcf,kagura-sub,kagura-co)' \
            "$out/ios-plain.bc" -o "$out/ios-candidate.bc" \
            2>&1 | tee "$out/ios-pass.log"
          "$KAGURA_LLVM/bin/clang" -O0 -target arm64-apple-ios15.0 -isysroot "$sdk" \
            -c "$out/ios-plain.bc" -o "$out/ios-plain.o"
          "$KAGURA_LLVM/bin/clang" -O0 -target arm64-apple-ios15.0 -isysroot "$sdk" \
            -c "$out/ios-candidate.bc" -o "$out/ios-candidate.o"
          xcrun clang -target arm64-apple-ios15.0 -isysroot "$sdk" -dynamiclib \
            "$out/ios-plain.o" -o "$out/ios-plain.dylib"
          xcrun clang -target arm64-apple-ios15.0 -isysroot "$sdk" -dynamiclib \
            "$out/ios-candidate.o" -o "$out/ios-candidate.dylib"
          # ARM64E must remain Apple Clang-only; never relabel old PAC ABI.
          xcrun clang -O1 -target arm64e-apple-ios15.0 -isysroot "$sdk" \
            -dynamiclib "$dir/critical.c" -o "$out/ios-arm64e.dylib"
          xcrun otool -hv "$out/ios-candidate.dylib" > "$out/ios-arm64-macho.txt"
          xcrun otool -hv "$out/ios-arm64e.dylib" > "$out/ios-arm64e-macho.txt"

      - name: Require actual IR/object change, plaintext removal and host parity
        run: |
          set -euo pipefail
          python3 scripts/custom_ollvm/kagura_max/audit.py \
            --native-plain-object "$KAGURA_OUT/host-plain.o" \
            --native-protected-object "$KAGURA_OUT/host-candidate.o" \
            --native-plain-ir "$KAGURA_OUT/host-plain.bc" \
            --native-protected-ir "$KAGURA_OUT/host-candidate.bc" \
            --native-plain-log "$KAGURA_OUT/host-plain.log" \
            --native-protected-log "$KAGURA_OUT/host-candidate.log" \
            --ios-plain "$KAGURA_OUT/ios-plain.dylib" \
            --ios-protected "$KAGURA_OUT/ios-candidate.dylib" \
            --ios-arm64e "$KAGURA_OUT/ios-arm64e.dylib" \
            --out "$KAGURA_OUT/audit.json"
          cat "$KAGURA_OUT/audit.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'Kagura-only research; no Crane production pass merged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build standalone Kagura arm64 UIKit IPA with actual seven LLVM passes
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/scripts/custom_ollvm/kagura_max"
          out="$KAGURA_OUT"
          iphone="$out/ios-ondevice"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$iphone/KaguraLab.app"
          cp "$dir/ios_app_Info.plist" "$iphone/KaguraLab.app/Info.plist"
          plutil -lint "$iphone/KaguraLab.app/Info.plist"

          # SAME critical.c compiled twice. Untransformed baseline vs real
          # seven-pass protected symbol. Do not import host .o or arm64e dylib.
          for variant in plain protected; do
            "$KAGURA_LLVM/bin/clang" -O1 -std=c11 -Wall -Wextra -Werror \
              -target arm64-apple-ios15.0 -isysroot "$sdk" \
              -DDD_KAGURA_ENTRY=dd_kagura_"$variant" \
              -emit-llvm -c "$dir/critical.c" \
              -o "$iphone/$variant-input.bc"
          done
          "$KAGURA_LLVM/bin/clang" -O0 -target arm64-apple-ios15.0 \
            -isysroot "$sdk" -c "$iphone/plain-input.bc" \
            -o "$iphone/plain.o"

          current="$iphone/protected-input.bc"
          for pass in str fla bcf sub co bbr bbs; do
            if [ "$pass" = str ]; then
              pipeline=kagura-str
            else
              pipeline="function(kagura-$pass)"
            fi
            "$KAGURA_LLVM/bin/opt" --load-pass-plugin="$KAGURA_PLUGIN" \
              -kagura-seed=1234567 -debug-pass-manager \
              -passes="$pipeline" "$current" \
              -o "$iphone/protected-$pass.bc" \
              2> "$iphone/pass-$pass.log"
            test -s "$iphone/protected-$pass.bc"
            grep -q 'Running pass:' "$iphone/pass-$pass.log"
            current="$iphone/protected-$pass.bc"
          done
          "$KAGURA_LLVM/bin/clang" -O0 -target arm64-apple-ios15.0 \
            -isysroot "$sdk" -c "$current" \
            -o "$iphone/protected.o"
          python3 - "$iphone/plain.o" "$iphone/protected.o" <<'PY'
          import sys
          from pathlib import Path
          plain, candidate = [Path(s).read_bytes() for s in sys.argv[1:]]
          marker = b"DD_KAGURA_PUBLIC_CANARY_CE_STRING_V1"
          assert marker in plain, "baseline lacks public string marker"
          assert marker not in candidate, "Kagura protected object still exposes marker"
          assert plain != candidate, "Kagura failed to change the native object"
          PY

          xcrun clang -O1 -std=c11 -Wall -Wextra -Werror \
            -target arm64-apple-ios15.0 -isysroot "$sdk" \
            -c "$dir/ios_canary.c" -o "$iphone/ios_canary.o"
          xcrun clang -O1 -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -target arm64-apple-ios15.0 -isysroot "$sdk" \
            -c "$dir/ios_app_main.m" -o "$iphone/ios_app_main.o"
          xcrun clang -target arm64-apple-ios15.0 -isysroot "$sdk" \
            "$iphone/plain.o" "$iphone/protected.o" \
            "$iphone/ios_canary.o" "$iphone/ios_app_main.o" \
            -framework UIKit -framework Foundation \
            -o "$iphone/KaguraLab.app/KaguraLab"
          xcrun nm -gU "$iphone/KaguraLab.app/KaguraLab" > "$iphone/app-symbols.txt"
          grep -q '_dd_kagura_plain$' "$iphone/app-symbols.txt"
          grep -q '_dd_kagura_protected$' "$iphone/app-symbols.txt"
          xcrun otool -hv "$iphone/KaguraLab.app/KaguraLab" > "$iphone/arm64-macho.txt"
          python3 "$dir/package_ipa.py" \
            --app "$iphone/KaguraLab.app" \
            --ipa "$out/KaguraLab-TrollStore-arm64.ipa" \
            --report "$out/KaguraLab-TrollStore-report.json"
          python3 "$dir/ios_pipeline_audit.py" \
            --plain "$iphone/plain.o" --protected "$iphone/protected.o" \
            --app "$iphone/KaguraLab.app/KaguraLab" \
            --ipa "$out/KaguraLab-TrollStore-arm64.ipa" \
            --logs "$iphone" \
            --out "$out/KaguraLab-seven-pass-evidence.json"
          bash "$dir/verify_native_reference.sh" "$out"
          shasum -a 256 "$iphone/plain.o" "$iphone/protected.o" \
            "$iphone/KaguraLab.app/KaguraLab" > "$iphone/binary-sha256.txt"
          echo "Kagura iOS: unsigned arm64 MH_EXECUTE with plain + seven LLVM passes." >> "$GITHUB_STEP_SUMMARY"
          echo "KaguraLab-TrollStore-arm64.ipa: manual TrollStore import; device runtime NOT TESTED BY CI." >> "$GITHUB_STEP_SUMMARY"
          echo "arm64e: Apple Clang build/audit ONLY, no A12+ device runtime." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload isolated Kagura IR and Mach-O evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuoDash-Kagura-MAX-CANDIDATE-LLVM19-EXPERIMENTAL
          path: scripts/custom_ollvm/kagura_max/out/
          if-no-files-found: warn
