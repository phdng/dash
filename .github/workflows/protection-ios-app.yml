name: Protection Lab - iOS UIKit test app (Experimental)

# Standalone arm64 test IPA for manual TrollStore import; arm64e BUILD/AUDIT ONLY.
# No signing, provisioning, installation or Crane modification in CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-app:
    name: arm64 IPA for TrollStore + arm64e build-only ABI audit
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run test app and prior protection lab contracts
        run: |
          set -euo pipefail
          python3 scripts/test_ios_app_canary.py
          python3 scripts/test_protection_perf.py
          python3 scripts/test_device_evidence.py
          python3 scripts/test_xcode_device_project.py
          python3 scripts/test_trollstore_ipa.py
          python3 scripts/test_device_runtime_canary.py
          python3 scripts/test_objc_ce_pilot.py
          python3 scripts/test_igv_ibr_pilot.py
          python3 scripts/test_sllvm_pilot.py
          python3 scripts/test_protection_lab.py

      - name: Generate public bytecode and CE fixture headers
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/scripts/protection_lab"
          out="$RUNNER_TEMP/ios-lab-app"
          mkdir -p "$out"
          python3 "$lab/program.py" --out "$out/vm_program.h"
          python3 "$lab/sllvm_generator.py" --out "$out/sllvm_encoded.h"
          python3 "$lab/objc_ce_generator.py" --out "$out/objc_ce_data.h"
          plutil -lint "$lab/ios_app_Info.plist"
          xcrun clang --version > "$out/apple-clang-version.txt"

      - name: Verify macOS host timing protocol (not iOS performance)
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/scripts/protection_lab"
          out="$RUNNER_TEMP/ios-lab-app"
          xcrun clang -std=c11 -O1 -Wall -Wextra -Werror \
            -I "$lab" -I "$out" \
            "$lab/canary.c" "$lab/vm.c" \
            "$lab/sllvm_plain.c" "$lab/sllvm_protected.c" \
            "$lab/igv_ibr_plain.c" "$lab/igv_ibr_protected.c" \
            "$lab/perf_pilot.c" "$lab/perf_report.c" \
            "$lab/perf_host_runner.c" -o "$out/perf-host"
          "$out/perf-host" | tee "$out/host-performance.log"
          python3 "$lab/perf_audit.py" verify \
            --log "$out/host-performance.log" \
            --context MACOS_HOST --out "$out/host-performance-report.json"

      - name: Validate local-signing Xcode project without credentials
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/scripts/protection_lab"
          out="$RUNNER_TEMP/ios-lab-app"
          project="$lab/ios_xcode/ProtectionLab.xcodeproj"
          plutil -lint "$project/project.pbxproj"
          xcodebuild -project "$project" -scheme ProtectionLab \
            -configuration Debug -destination 'generic/platform=iOS' \
            -sdk iphoneos -derivedDataPath "$out/xcode-derived" \
            CODE_SIGNING_ALLOWED=NO build > "$out/xcode-arm64-build.log" 2>&1 || {
              tail -n 120 "$out/xcode-arm64-build.log"
              exit 1
            }
          binary="$out/xcode-derived/Build/Products/Debug-iphoneos/ProtectionLab.app/ProtectionLab"
          test -s "$binary"
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0, '$lab'); from device_audit import inspect_executable; print(inspect_executable(Path(sys.argv[1]), 'arm64')['cpu_subtype_raw'])" "$binary"
          xcrun otool -hv "$binary" > "$out/xcode-arm64-macho.txt"

      - name: Build separate unsigned UIKit app bundles for iPhone
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/scripts/protection_lab"
          out="$RUNNER_TEMP/ios-lab-app"
          clang="$(xcrun --sdk iphoneos --find clang)"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          for arch in arm64 arm64e; do
            mkdir -p "$out/$arch/objs"
            app="$out/ProtectionLab-$arch.app"
            mkdir -p "$app"
            cp "$lab/ios_app_Info.plist" "$app/Info.plist"
            for name in canary vm sllvm_plain sllvm_protected igv_ibr_plain igv_ibr_protected device_suites perf_pilot perf_report; do
              "$clang" -std=c11 -arch "$arch" -isysroot "$sdk" \
                -miphoneos-version-min=15.0 -O1 -Wall -Wextra -Werror \
                -I "$lab" -I "$out" -c "$lab/$name.c" \
                -o "$out/$arch/objs/$name.o"
            done
            for name in objc_ce_plain objc_ce_protected ios_app_main; do
              "$clang" -fobjc-arc -arch "$arch" -isysroot "$sdk" \
                -miphoneos-version-min=15.0 -O1 -Wall -Wextra -Werror \
                -I "$lab" -I "$out" -c "$lab/$name.m" \
                -o "$out/$arch/objs/$name.o"
            done
            "$clang" -arch "$arch" -isysroot "$sdk" \
              -miphoneos-version-min=15.0 "$out/$arch/objs/"*.o \
              -framework UIKit -framework Foundation -o "$app/ProtectionLab"
            test -s "$app/ProtectionLab"
            xcrun otool -hv "$app/ProtectionLab" > "$out/macho-$arch.txt"
            xcrun otool -L "$app/ProtectionLab" > "$out/dependencies-$arch.txt"
            plutil -lint "$app/Info.plist"
            shasum -a 256 "$app/ProtectionLab" >> "$out/binary-sha256.txt"
            ditto -c -k --sequesterRsrc --keepParent "$app" \
              "$out/ProtectionLab-UNSIGNED-$arch.zip"
            test -s "$out/ProtectionLab-UNSIGNED-$arch.zip"
          done
          python3 "$lab/device_audit.py" build \
            --arm64 "$out/ProtectionLab-arm64.app/ProtectionLab" \
            --arm64e "$out/ProtectionLab-arm64e.app/ProtectionLab" \
            --out "$out/build-report.json"
          python3 "$lab/device_evidence.py" build \
            --arm64 "$out/ProtectionLab-arm64.app/ProtectionLab" \
            --arm64e "$out/ProtectionLab-arm64e.app/ProtectionLab" \
            --out "$out/build-identity.json"
          # Only arm64 is packaged for manual TrollStore import.
          # arm64e stays strict Apple Clang build + ABI/UUID audit ONLY.
          python3 "$lab/package_trollstore_ipa.py" \
            --app "$out/ProtectionLab-arm64.app" \
            --ipa "$out/ProtectionLab-TrollStore-arm64.ipa" \
            --report "$out/TrollStore-IPA-report.json"
          python3 "$lab/build_gate.py" \
            --build "$out/build-report.json" \
            --identity "$out/build-identity.json" \
            --ipa "$out/TrollStore-IPA-report.json" \
            --out "$out/build-gates.json"
          echo '### UIKit on-device parity application — unsigned bundles' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two Apple Clang iPhoneOS MH_EXECUTE app binaries ABI-validated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'arm64 test IPA packaged for manual TrollStore import; installation NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'arm64e: Apple Clang compilation + strict ABI/Mach-O/UUID PASS only; no A12+ runtime requirement.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unsigned standard arm64 Xcode project also passed xcodebuild; device signing remains manual.' >> "$GITHUB_STEP_SUMMARY"
          echo 'LC_UUID identity extracted per app; user logs must be checked separately.' >> "$GITHUB_STEP_SUMMARY"
          echo 'UUID is not device cryptographic attestation or proof of PAC enforcement.' >> "$GITHUB_STEP_SUMMARY"
          echo 'On-device ARC/function-pointer/PAC runtime: NOT TESTED in CI.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Optional timed samples are observations, not iOS measurements or acceptance gates.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No CI signing, installation, device execution, or Crane modification.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm64 TrollStore test IPA and arm64e build-only proof
        uses: actions/upload-artifact@v4
        with:
          name: ProtectionLab-UIKit-OnDevice-UNSIGNED-arm64-arm64e
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ios-lab-app/ProtectionLab-TrollStore-arm64.ipa
            ${{ runner.temp }}/ios-lab-app/TrollStore-IPA-report.json
            ${{ runner.temp }}/ios-lab-app/build-gates.json
            ${{ runner.temp }}/ios-lab-app/ProtectionLab-UNSIGNED-arm64.zip
            ${{ runner.temp }}/ios-lab-app/ProtectionLab-UNSIGNED-arm64e.zip
            ${{ runner.temp }}/ios-lab-app/build-report.json
            ${{ runner.temp }}/ios-lab-app/build-identity.json
            ${{ runner.temp }}/ios-lab-app/binary-sha256.txt
            ${{ runner.temp }}/ios-lab-app/macho-arm64.txt
            ${{ runner.temp }}/ios-lab-app/macho-arm64e.txt
            ${{ runner.temp }}/ios-lab-app/dependencies-arm64.txt
            ${{ runner.temp }}/ios-lab-app/dependencies-arm64e.txt
            ${{ runner.temp }}/ios-lab-app/apple-clang-version.txt
            ${{ runner.temp }}/ios-lab-app/xcode-arm64-build.log
            ${{ runner.temp }}/ios-lab-app/xcode-arm64-macho.txt
            ${{ runner.temp }}/ios-lab-app/host-performance.log
            ${{ runner.temp }}/ios-lab-app/host-performance-report.json
