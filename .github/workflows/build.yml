name: Build Reconstruction

on:
  push:
    paths:
      - "Makefile"
      - "control"
      - "DuoDashReconstruction.plist"
      - "re/RECONSTRUCTION/**"
      - "scripts/verify_reconstruction.py"
      - "scripts/hostflow_preflight_smoke.m"
      - "scripts/test_dock_geometry_vectors.py"
      - "scripts/test_ollvm_integration.py"
      - "scripts/verify_ollvm_log.py"
      - "scripts/ollvm_probe.c"
      - "policy.json"
      - "docs/OLLVM.md"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "Makefile"
      - "control"
      - "DuoDashReconstruction.plist"
      - "re/RECONSTRUCTION/**"
      - "scripts/verify_reconstruction.py"
      - "scripts/hostflow_preflight_smoke.m"
      - "scripts/test_dock_geometry_vectors.py"
      - "scripts/test_ollvm_integration.py"
      - "scripts/verify_ollvm_log.py"
      - "scripts/ollvm_probe.c"
      - "policy.json"
      - "docs/OLLVM.md"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      ollvm:
        description: "Also build and upload OLLVM dylib (enabled by default)"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/.theos-sdk
      # Push/PR builds always produce both variants. Manual runs may opt out.
      OLLVM_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.ollvm == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify reconstruction structure
        run: python3 scripts/verify_reconstruction.py

      - name: Verify dock geometry vectors
        run: python3 scripts/test_dock_geometry_vectors.py

      - name: Verify OLLVM policy configuration
        run: python3 scripts/test_ollvm_integration.py

      - name: Execute compiled host switch preflight smoke test
        run: |
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation -framework CoreFoundation -framework CoreGraphics \
            -I re/RECONSTRUCTION \
            re/RECONSTRUCTION/HostFlowAdapter.m scripts/hostflow_preflight_smoke.m \
            -o "$RUNNER_TEMP/hostflow_preflight_smoke"
          "$RUNNER_TEMP/hostflow_preflight_smoke"

      - name: Compile host adapter and smoke harness for macOS arm64
        run: |
          xcrun clang -arch arm64 -c -fobjc-arc -fblocks \
            -Wall -Wextra -Werror \
            -I re/RECONSTRUCTION \
            re/RECONSTRUCTION/HostFlowAdapter.m \
            -o "$RUNNER_TEMP/HostFlowAdapter_arm64.o"
          xcrun clang -arch arm64 -c -fobjc-arc -fblocks \
            -Wall -Wextra -Werror \
            -I re/RECONSTRUCTION \
            scripts/hostflow_preflight_smoke.m \
            -o "$RUNNER_TEMP/hostflow_preflight_smoke_arm64.o"
          xcrun clang -arch arm64 -fobjc-arc -fblocks \
            -Wall -Wextra -Werror \
            -framework Foundation -framework CoreFoundation -framework CoreGraphics \
            "$RUNNER_TEMP/HostFlowAdapter_arm64.o" \
            "$RUNNER_TEMP/hostflow_preflight_smoke_arm64.o" \
            -o "$RUNNER_TEMP/hostflow_preflight_smoke_arm64"
          xcrun lipo "$RUNNER_TEMP/hostflow_preflight_smoke_arm64" -verify_arch arm64

      - name: Install Theos prerequisites
        run: brew install ldid xz

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Build tweak (standard)
        run: make clean all

      - name: Collect standard dylib
        run: |
          mkdir -p dist
          dylib="$(find .theos/obj -type f -name 'DuoDashReconstruction.dylib' -print -quit)"
          test -n "$dylib"
          cp "$dylib" dist/DuoDashReconstruction.dylib
          cp DuoDashReconstruction.plist dist/DuoDashReconstruction.plist

      - name: Upload standard artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDashReconstruction
          path: dist/
          if-no-files-found: error

      - name: Install LLVM 19 and compile pinned OLLVM plugin
        if: ${{ env.OLLVM_ENABLED == 'true' }}
        run: |
          brew install llvm@19 cmake ninja
          source_dir="$RUNNER_TEMP/ollvm-pass"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/lich4/ollvm-pass.git
          git -C "$source_dir" fetch --depth 1 origin 592f215f852e3957da01b2b15024dc63713a462e
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "592f215f852e3957da01b2b15024dc63713a462e"
          llvm_prefix="$(brew --prefix llvm@19)"
          cmake -S "$source_dir/obfuscator" -B "$RUNNER_TEMP/ollvm-build" -G Ninja \
            -DLLVM_DIR="$llvm_prefix/lib/cmake/llvm"
          cmake --build "$RUNNER_TEMP/ollvm-build" --parallel 3
          plugin="$(find "$RUNNER_TEMP/ollvm-build" -type f \( -name 'Obfuscator.dylib' -o -name 'Obfuscator.so' \) -print -quit)"
          test -n "$plugin"
          test -f "$plugin"
          echo "OLLVM_PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "OLLVM_CLANG=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "OLLVM_CLANGXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"

      - name: Verify OLLVM actually transforms iOS arm64 code
        if: ${{ env.OLLVM_ENABLED == 'true' }}
        run: |
          set -o pipefail
          "$OLLVM_CLANG" -O1 -target arm64-apple-ios14.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -fpass-plugin="$OLLVM_PLUGIN" \
            -c scripts/ollvm_probe.c -o "$RUNNER_TEMP/ollvm_probe_arm64.o" \
            2>&1 | tee "$RUNNER_TEMP/ollvm_probe.log"
          python3 scripts/verify_ollvm_log.py probe "$RUNNER_TEMP/ollvm_probe.log"
          xcrun lipo "$RUNNER_TEMP/ollvm_probe_arm64.o" -verify_arch arm64

      - name: Compare native OLLVM probe with unmodified Clang output
        if: ${{ env.OLLVM_ENABLED == 'true' }}
        run: |
          set -o pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun clang -O1 -DOLLVM_PROBE_MAIN -isysroot "$sdk" \
            scripts/ollvm_probe.c -o "$RUNNER_TEMP/probe_plain"
          "$OLLVM_CLANG" -O1 -DOLLVM_PROBE_MAIN -isysroot "$sdk" \
            -fpass-plugin="$OLLVM_PLUGIN" scripts/ollvm_probe.c \
            -o "$RUNNER_TEMP/probe_obfuscated" \
            2>&1 | tee "$RUNNER_TEMP/ollvm_probe_native.log"
          python3 scripts/verify_ollvm_log.py probe "$RUNNER_TEMP/ollvm_probe_native.log"
          "$RUNNER_TEMP/probe_plain" > "$RUNNER_TEMP/probe_plain.txt"
          "$RUNNER_TEMP/probe_obfuscated" > "$RUNNER_TEMP/probe_obfuscated.txt"
          test "$(wc -l < "$RUNNER_TEMP/probe_plain.txt" | tr -d ' ')" = 513
          cmp "$RUNNER_TEMP/probe_plain.txt" "$RUNNER_TEMP/probe_obfuscated.txt"
          echo "OLLVM native probe matches baseline across 513 input values and 3 functions" >> "$GITHUB_STEP_SUMMARY"

      - name: Build tweak (OLLVM)
        if: ${{ env.OLLVM_ENABLED == 'true' }}
        run: |
          set -o pipefail
          make clean all OLLVM=1 OLLVM_PLUGIN="$OLLVM_PLUGIN" \
            TARGET_CC="$OLLVM_CLANG" TARGET_CXX="$OLLVM_CLANGXX" \
            TARGET_LD="$(xcrun --find clang++)" \
            2>&1 | tee "$RUNNER_TEMP/ollvm_tweak.log"
          python3 scripts/verify_ollvm_log.py tweak "$RUNNER_TEMP/ollvm_tweak.log"

      - name: Collect OLLVM dylib
        if: ${{ env.OLLVM_ENABLED == 'true' }}
        run: |
          mkdir -p dist-ollvm
          dylib="$(find .theos/obj -type f -name 'DuoDashReconstruction.dylib' -print -quit)"
          test -n "$dylib"
          cp "$dylib" dist-ollvm/DuoDashReconstruction.dylib
          cp DuoDashReconstruction.plist dist-ollvm/DuoDashReconstruction.plist
          echo "### DuoDash OLLVM comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | dylib size (bytes) | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | --- |" >> "$GITHUB_STEP_SUMMARY"
          for variant in standard ollvm; do
            if [ "$variant" = standard ]; then
              path="dist/DuoDashReconstruction.dylib"
            else
              path="dist-ollvm/DuoDashReconstruction.dylib"
            fi
            bytes="$(wc -c < "$path" | tr -d ' ')"
            sha="$(shasum -a 256 "$path" | cut -d ' ' -f 1)"
            echo "| $variant | $bytes | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload OLLVM artifact
        if: ${{ env.OLLVM_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DuoDashReconstruction-OLLVM
          path: dist-ollvm/
          if-no-files-found: error
