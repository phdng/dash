name: Kagura K21 - Static AArch64 Word Inventory Offline (Experimental)

# Manual isolated research only: static 32-bit word pattern statistics from K20
# corroborated symbol-address intervals. Not a disassembler, true function-size,
# CFG, security/anti-tamper, runtime, or device attestation.
# K18 explicitly skipped; K15 weak stub never invoked. No Crane/PAC changes.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  k21-static-opcodes:
    runs-on: macos-14
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Portable K21-K13 source-grounded gates and registry audit
        run: |
          set -euo pipefail
          python3 scripts/test_kagura_k21_opcode_inventory.py
          python3 scripts/test_kagura_k20_function_starts.py
          python3 scripts/test_kagura_k19_symbol_ranges.py
          python3 scripts/test_kagura_k16_offline_text.py
          python3 scripts/test_kagura_k15_bbcheck.py
          python3 scripts/test_kagura_k14_ios_ipa.py
          python3 scripts/test_kagura_k13_native.py
          python3 scripts/test_custom_ollvm_pass_matrix.py
          python3 scripts/custom_ollvm/audit_passes.py

      - name: Pin exact K13-K20 Kagura LLVM19 source
        run: |
          set -euo pipefail
          brew install llvm@19 cmake ninja
          llvm="$(brew --prefix llvm@19)"
          src="$RUNNER_TEMP/kagura-k21-source"
          build="$RUNNER_TEMP/kagura-k21-build"
          commit="ac2136ee0408677cf7cdee55307e9b16edd5f4d5"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/qusamulab/kagura.git
          git -C "$src" fetch --depth 1 origin "$commit"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$commit"
          test -s "$src/LICENSE"
          python3 - "$src/include/kagura/PassRegistry.def" <<'PY'
          import hashlib, pathlib, sys
          actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          assert actual == "6f15bc2b432a6d1d84e83ecdb6221cc359e42adee40d0f93f36d75b2c363b5fa", "K21 pinned registry SHA mismatch"
          PY
          cmake -S "$src" -B "$build" -G Ninja \
            -DLLVM_DIR="$llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="$llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" \
            -DKAGURA_BUILD_TESTS=OFF
          cmake --build "$build" --parallel 3
          plugin="$(find "$build" -type f \
            \( -name KaguraObfuscator.dylib -o -name KaguraObfuscator.so \) -print -quit)"
          test -n "$plugin" && test -s "$plugin"
          echo "K21_LLVM=$llvm" >> "$GITHUB_ENV"
          echo "K21_SRC=$src" >> "$GITHUB_ENV"
          echo "K21_PLUGIN=$plugin" >> "$GITHUB_ENV"

      - name: Rebuild isolated K13 and K14 executable specimens
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/Kagura-K21-Static-Opcodes"
          mkdir -p "$out"
          echo "K21_OUT=$out" >> "$GITHUB_ENV"
          python3 scripts/custom_ollvm/kagura_k13/pilot.py \
            --src "$K21_SRC" --llvm "$K21_LLVM" --plugin "$K21_PLUGIN" \
            --out "$out"
          python3 scripts/custom_ollvm/kagura_k13/audit.py --out "$out"
          bash scripts/custom_ollvm/kagura_k14/build_ipa.sh \
            "$K21_LLVM" "$K21_SRC" "$out"

      - name: Replay K16 and K19 exact post-link source manifests
        run: |
          set -euo pipefail
          python3 scripts/custom_ollvm/kagura_k16/macho_measure.py --out "$K21_OUT"
          python3 scripts/custom_ollvm/kagura_k16/macho_measure.py --out "$K21_OUT" --verify
          python3 scripts/custom_ollvm/kagura_k19/symbol_ranges.py --out "$K21_OUT"
          python3 scripts/custom_ollvm/kagura_k19/symbol_ranges.py --out "$K21_OUT" --verify

      - name: Replay K20 function starts and measure K21 AArch64 word patterns
        run: |
          set -euo pipefail
          python3 scripts/custom_ollvm/kagura_k20/function_starts.py --out "$K21_OUT"
          python3 scripts/custom_ollvm/kagura_k20/function_starts.py --out "$K21_OUT" --verify
          python3 scripts/custom_ollvm/kagura_k21/opcode_inventory.py --out "$K21_OUT"
          python3 scripts/custom_ollvm/kagura_k21/opcode_inventory.py --out "$K21_OUT" --verify
          echo "K21: static 32-bit AArch64 word-pattern inventory on genuine K20-nlist correlated intervals, NOT disassembly or CFG." >> "$GITHUB_STEP_SUMMARY"
          echo "K21: unsigned metadata/no trust root; K18 user-skipped; NO runtime integrity, device execution, security, PAC, or Crane production changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload specimens and reports even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuoDash-Kagura-K21-STATIC-OPCODE-INVENTORY-OFFLINE-EXPERIMENTAL
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/Kagura-K21-Static-Opcodes/
