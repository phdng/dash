name: Evaluate Hikari Obfuscation (Experimental)

# Intentionally manual-only. Does not alter the production Reconstruction job.
on:
  workflow_dispatch:
    inputs:
      build_tweak:
        description: "Also produce a Hikari-only experimental DuoDash dylib (NOT FOR PRODUCTION)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  hikari-probe:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: scripts/hikari_eval

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate isolated Hikari policy and tests
        run: |
          python3 ../test_hikari_integration.py
          python3 ../test_custom_ollvm_pass_matrix.py

      - name: Compile pinned Hikari pass for LLVM 19
        run: |
          set -euo pipefail
          brew install llvm@19 cmake ninja
          source_dir="$RUNNER_TEMP/hikari-source"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/lich4/ollvm-pass.git
          git -C "$source_dir" fetch --depth 1 origin 592f215f852e3957da01b2b15024dc63713a462e
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "592f215f852e3957da01b2b15024dc63713a462e"
          llvm_prefix="$(brew --prefix llvm@19)"
          cmake -S "$source_dir/hikari" -B "$RUNNER_TEMP/hikari-build" -G Ninja \
            -DLLVM_DIR="$llvm_prefix/lib/cmake/llvm"
          cmake --build "$RUNNER_TEMP/hikari-build" --parallel 3
          plugin="$(find "$RUNNER_TEMP/hikari-build" -type f \
            \( -name 'Hikari.dylib' -o -name 'Hikari.so' \
            -o -name 'libHikari.dylib' -o -name 'libHikari.so' \) -print -quit)"
          test -n "$plugin"
          test -f "$plugin"
          echo "HIKARI_PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "HIKARI_CLANG=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"

      - name: Native macOS semantics and plaintext audit
        run: |
          set -euo pipefail
          mkdir -p out
          printf '# Hikari experimental report\n\n' > out/report.md
          printf 'This report is from disposable fixture code, not the DuoDash tweak.\n\n' >> out/report.md
          printf '| Target | Plain .o bytes | Hikari .o bytes | Plain SHA-256 prefix | Hikari SHA-256 prefix | Checks |\n' >> out/report.md
          printf '| --- | ---: | ---: | --- | --- | --- |\n' >> out/report.md
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun clang -O1 -Wall -Wextra -Werror -isysroot "$sdk" \
            -c probe.c -o out/probe-native-plain.o
          "$HIKARI_CLANG" -O1 -Wall -Wextra -Werror -isysroot "$sdk" \
            -fpass-plugin="$HIKARI_PLUGIN" \
            -c probe.c -o out/probe-native-hikari.o \
            2>&1 | tee out/hikari-native.log
          xcrun clang -O1 -Wall -Wextra -Werror -isysroot "$sdk" \
            -c runner.c -o out/runner.o
          xcrun clang out/probe-native-plain.o out/runner.o -o out/probe-native-plain
          xcrun clang out/probe-native-hikari.o out/runner.o -o out/probe-native-hikari
          ./out/probe-native-plain > out/native-plain.txt
          ./out/probe-native-hikari > out/native-hikari.txt
          python3 audit.py native out/probe-native-plain.o out/probe-native-hikari.o \
            out/hikari-native.log out/report.md \
            --plain-output out/native-plain.txt \
            --protected-output out/native-hikari.txt \
            --protected-executable out/probe-native-hikari

      - name: Cross-compile iOS arm64 fixture and audit plaintext marker
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -O1 -Wall -Wextra -Werror -target arm64-apple-ios14.0 \
            -isysroot "$sdk" -c probe.c -o out/probe-ios-plain.o
          "$HIKARI_CLANG" -O1 -Wall -Wextra -Werror -target arm64-apple-ios14.0 \
            -isysroot "$sdk" -fpass-plugin="$HIKARI_PLUGIN" \
            -c probe.c -o out/probe-ios-hikari.o \
            2>&1 | tee out/hikari-ios.log
          xcrun lipo out/probe-ios-hikari.o -verify_arch arm64
          python3 audit.py ios out/probe-ios-plain.o out/probe-ios-hikari.o \
            out/hikari-ios.log out/report.md
          printf '\nChecks: pass invocation logs, test-only plaintext, exact 513 native vectors.\n' >> out/report.md
          printf 'iOS arm64 is compile-only; no iPhone runtime coverage is implied.\n' >> out/report.md

      - name: Prepare real DuoDash Objective-C helper pilot
        run: |
          set -euo pipefail
          pilot_dir="$RUNNER_TEMP/hikari-objc-pilot"
          python3 extract_pilot.py --output "$pilot_dir/pilot.m"
          cp pilot_policy.json "$pilot_dir/policy.json"
          test -f "$pilot_dir/pilot.m"
          test -f "$pilot_dir/policy.json"
          echo "HIKARI_PILOT_DIR=$pilot_dir" >> "$GITHUB_ENV"

      - name: Compare real Objective-C helpers on macOS
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          cd "$HIKARI_PILOT_DIR"
          xcrun clang -O1 -fobjc-arc -Wall -Wextra -Werror -isysroot "$sdk" \
            -c pilot.m -o pilot-native-plain.o
          "$HIKARI_CLANG" -O1 -fobjc-arc -Wall -Wextra -Werror -isysroot "$sdk" \
            -fpass-plugin="$HIKARI_PLUGIN" \
            -c pilot.m -o pilot-native-hikari.o \
            2>&1 | tee "$GITHUB_WORKSPACE/scripts/hikari_eval/out/hikari-objc-native.log"
          xcrun clang -O1 -fobjc-arc -Wall -Wextra -Werror -isysroot "$sdk" \
            -c "$GITHUB_WORKSPACE/scripts/hikari_eval/pilot_runner.m" \
            -o pilot-runner.o
          xcrun clang -framework Foundation pilot-native-plain.o pilot-runner.o \
            -o pilot-native-plain
          xcrun clang -framework Foundation pilot-native-hikari.o pilot-runner.o \
            -o pilot-native-hikari
          ./pilot-native-plain > pilot-native-plain.txt
          ./pilot-native-hikari > pilot-native-hikari.txt
          python3 "$GITHUB_WORKSPACE/scripts/hikari_eval/audit_pilot.py" native \
            pilot-native-plain.o pilot-native-hikari.o \
            "$GITHUB_WORKSPACE/scripts/hikari_eval/out/hikari-objc-native.log" \
            "$GITHUB_WORKSPACE/scripts/hikari_eval/out/report.md" \
            --plain-output pilot-native-plain.txt \
            --protected-output pilot-native-hikari.txt \
            --protected-executable pilot-native-hikari

      - name: Cross-compile real Objective-C helpers for iOS arm64
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          cd "$HIKARI_PILOT_DIR"
          xcrun clang -O1 -fobjc-arc -Wall -Wextra -Werror \
            -target arm64-apple-ios14.0 -isysroot "$sdk" \
            -c pilot.m -o pilot-ios-plain.o
          "$HIKARI_CLANG" -O1 -fobjc-arc -Wall -Wextra -Werror \
            -target arm64-apple-ios14.0 -isysroot "$sdk" \
            -fpass-plugin="$HIKARI_PLUGIN" \
            -c pilot.m -o pilot-ios-hikari.o \
            2>&1 | tee "$GITHUB_WORKSPACE/scripts/hikari_eval/out/hikari-objc-ios.log"
          xcrun lipo pilot-ios-hikari.o -verify_arch arm64
          xcrun nm -g pilot-ios-hikari.o | grep -Fq '_DDVersionDeviceSanitizeMachineModel'
          xcrun nm -g pilot-ios-hikari.o | grep -Fq '_DDVersionDeviceFormatClientVersion'
          python3 "$GITHUB_WORKSPACE/scripts/hikari_eval/audit_pilot.py" ios \
            pilot-ios-plain.o pilot-ios-hikari.o \
            "$GITHUB_WORKSPACE/scripts/hikari_eval/out/hikari-objc-ios.log" \
            "$GITHUB_WORKSPACE/scripts/hikari_eval/out/report.md"
          printf '\nObjective-C real-source helper pilot: native equivalence tested; iOS arm64 compile-only.\n' >> "$GITHUB_WORKSPACE/scripts/hikari_eval/out/report.md"
          cat "$GITHUB_WORKSPACE/scripts/hikari_eval/out/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare isolated Hikari tweak sandbox
        if: ${{ inputs.build_tweak == true }}
        run: |
          set -euo pipefail
          brew install ldid xz
          export THEOS="$GITHUB_WORKSPACE/.theos-sdk"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          trial_dir="$RUNNER_TEMP/duodash-hikari-tweak"
          mkdir -p "$trial_dir/re" "$GITHUB_WORKSPACE/scripts/hikari_eval/out/tweak-pilot"
          cp -R "$GITHUB_WORKSPACE/re/RECONSTRUCTION" "$trial_dir/re/RECONSTRUCTION"
          cp "$GITHUB_WORKSPACE/Makefile" "$trial_dir/Makefile"
          cp "$GITHUB_WORKSPACE/DuoDashReconstruction.plist" "$trial_dir/"
          cp "$GITHUB_WORKSPACE/control" "$trial_dir/"
          cp "$GITHUB_WORKSPACE/scripts/hikari_eval/tweak_policy.json" "$trial_dir/policy.json"
          test -f "$trial_dir/re/RECONSTRUCTION/VersionDeviceHelpers.m"
          echo "HIKARI_TWEAK_DIR=$trial_dir" >> "$GITHUB_ENV"

      - name: Build baseline tweak in isolated sandbox
        if: ${{ inputs.build_tweak == true }}
        run: |
          set -euo pipefail
          cd "$HIKARI_TWEAK_DIR"
          make clean all
          dylib="$(find .theos/obj -type f -name 'DuoDashReconstruction.dylib' -print -quit)"
          test -n "$dylib"
          out="$GITHUB_WORKSPACE/scripts/hikari_eval/out/tweak-pilot"
          cp "$dylib" "$out/DuoDashReconstruction-baseline.dylib"
          xcrun lipo "$out/DuoDashReconstruction-baseline.dylib" -verify_arch arm64

      - name: Build Hikari-only experimental tweak
        if: ${{ inputs.build_tweak == true }}
        run: |
          set -euo pipefail
          cd "$HIKARI_TWEAK_DIR"
          # Command-line override preserves all default ObjC flags.
          # Deliberately NEVER set OLLVM=1: do not load both LLVM passes.
          make clean all \
            TARGET_CC="$HIKARI_CLANG" TARGET_CXX="$(dirname "$HIKARI_CLANG")/clang++" \
            TARGET_LD="$(xcrun --find clang++)" \
            DuoDashReconstruction_CFLAGS="-fobjc-arc -Wall -Wextra -O1 -fpass-plugin=$HIKARI_PLUGIN" \
            2>&1 | tee "$GITHUB_WORKSPACE/scripts/hikari_eval/out/hikari-tweak.log"
          dylib="$(find .theos/obj -type f -name 'DuoDashReconstruction.dylib' -print -quit)"
          test -n "$dylib"
          out="$GITHUB_WORKSPACE/scripts/hikari_eval/out/tweak-pilot"
          cp "$dylib" "$out/DuoDashReconstruction.dylib"
          cp "$GITHUB_WORKSPACE/DuoDashReconstruction.plist" "$out/"
          xcrun lipo "$out/DuoDashReconstruction.dylib" -verify_arch arm64
          xcrun nm -g "$out/DuoDashReconstruction.dylib" > "$out/hikari-symbols.txt"
          python3 "$GITHUB_WORKSPACE/scripts/hikari_eval/verify_tweak.py" \
            "$out/DuoDashReconstruction-baseline.dylib" \
            "$out/DuoDashReconstruction.dylib" \
            "$GITHUB_WORKSPACE/scripts/hikari_eval/out/hikari-tweak.log" \
            "$out/hikari-symbols.txt" \
            "$GITHUB_WORKSPACE/scripts/hikari_eval/out/report.md"
          cat "$GITHUB_WORKSPACE/scripts/hikari_eval/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat > "$out/EXPERIMENTAL-NOT-FOR-PRODUCTION.txt" <<'NOTE'
          Experimental Hikari-only DuoDash Reconstruction tweak binary.
          The two selected helpers were obfuscated with Hikari (not OLLVM).
          This artifact has NOT been tested on an iPhone.
          Keep standard and OLLVM builds as the rollback baseline.
          Do not distribute or install on a primary device.
          NOTE

      - name: Upload experimental Hikari tweak (opt-in only)
        if: ${{ inputs.build_tweak == true }}
        uses: actions/upload-artifact@v4
        with:
          name: DuoDashReconstruction-Hikari-EXPERIMENTAL
          path: |
            scripts/hikari_eval/out/tweak-pilot/DuoDashReconstruction.dylib
            scripts/hikari_eval/out/tweak-pilot/DuoDashReconstruction.plist
            scripts/hikari_eval/out/tweak-pilot/EXPERIMENTAL-NOT-FOR-PRODUCTION.txt
          if-no-files-found: error

      - name: Upload Hikari test-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuoDash-Hikari-Evaluation-Diagnostics
          path: |
            scripts/hikari_eval/out/report.md
            scripts/hikari_eval/out/hikari-native.log
            scripts/hikari_eval/out/hikari-ios.log
            scripts/hikari_eval/out/hikari-objc-native.log
            scripts/hikari_eval/out/hikari-objc-ios.log
            scripts/hikari_eval/out/hikari-tweak.log
          if-no-files-found: warn
