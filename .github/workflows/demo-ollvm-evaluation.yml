name: Evaluate OLLVM on Crane Demo (Experimental)

# Independent of DuoDash and the demo's own nested CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-ollvm:
    name: Crane Demo OLLVM (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rootless
            scheme: rootless
            theos_repo: theos/theos
            deb_arch: iphoneos-arm64
          - variant: roothide
            scheme: roothide
            theos_repo: roothide/theos
            deb_arch: iphoneos-arm64e
    runs-on: macos-14
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout DuoDash workspace with demo source
        uses: actions/checkout@v4

      - name: Validate demo source and isolated evaluation policy
        run: |
          set -euo pipefail
          test -f demo/reconstruction/Makefile || {
            echo "::error::demo/reconstruction is absent from this Git commit; commit the demo source before running this job."
            exit 1
          }
          python3 scripts/test_demo_ollvm.py

      - name: Install Theos and the demo's build prerequisites
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: ${{ matrix.theos_repo }}
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          altlist: "true"
          altlist-src: opa334/AltList
          altlist-branch: main
          remotelog: "false"
          libgcuniversal: "false"
          comet: "false"
          orion: "false"

      - name: Install Debian package inspection tool
        run: |
          set -euo pipefail
          # Theos can package with its own dm.pl, but that does not provide dpkg-deb.
          # Both baseline and OLLVM need dpkg-deb to inspect the .deb payload.
          brew install dpkg
          command -v dpkg-deb
          dpkg-deb --version

      - name: Prepare and build unmodified demo baseline
        run: |
          set -euo pipefail
          python3 scripts/demo_ollvm/prepare.py \
            --source demo/reconstruction --dest "$RUNNER_TEMP/crane-demo-plain" \
            --variant baseline --scheme "${{ matrix.scheme }}"
          mkdir -p "$RUNNER_TEMP/demo-comparison" "$RUNNER_TEMP/demo-expanded-plain" "$RUNNER_TEMP/demo-control-plain"
          cd "$RUNNER_TEMP/crane-demo-plain"
          set -o pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            2>&1 | tee "$RUNNER_TEMP/demo-comparison/baseline-build.log"
          deb="$(find packages -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          cp "$deb" "$RUNNER_TEMP/demo-comparison/Crane-demo-${{ matrix.variant }}-baseline.deb"
          command -v dpkg-deb
          dpkg-deb -x "$deb" "$RUNNER_TEMP/demo-expanded-plain"
          dpkg-deb -e "$deb" "$RUNNER_TEMP/demo-control-plain"
          test -f "$RUNNER_TEMP/demo-control-plain/postinst"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          python3 "$GITHUB_WORKSPACE/scripts/demo_ollvm/verify_install.py" \
            --sandbox "$RUNNER_TEMP/crane-demo-plain" \
            --payload "$RUNNER_TEMP/demo-expanded-plain" \
            --control "$RUNNER_TEMP/demo-control-plain" --scheme "${{ matrix.scheme }}"
          if [ "${{ matrix.scheme }}" = roothide ]; then
            python3 "$GITHUB_WORKSPACE/demo/reconstruction/tools/verify_package_layout.py" \
              "$RUNNER_TEMP/demo-expanded-plain" "$RUNNER_TEMP/demo-control-plain"
            python3 "$GITHUB_WORKSPACE/demo/reconstruction/tools/verify_helper_entitlements.py" \
              "$RUNNER_TEMP/demo-expanded-plain" roothide
          fi
          python3 "$GITHUB_WORKSPACE/demo/reconstruction/tools/verify_architectures.py" "$RUNNER_TEMP/demo-expanded-plain"

      - name: Upload clean demo baseline (retained if OLLVM fails)
        uses: actions/upload-artifact@v4
        with:
          name: CraneDemo-Baseline-${{ matrix.variant }}-EXPERIMENTAL
          path: ${{ runner.temp }}/demo-comparison/Crane-demo-${{ matrix.variant }}-baseline.deb
          if-no-files-found: error

      - name: Compile pinned OLLVM pass plugin using LLVM 19
        run: |
          set -euo pipefail
          brew install llvm@19 cmake ninja
          source_dir="$RUNNER_TEMP/demo-ollvm-pass"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/lich4/ollvm-pass.git
          git -C "$source_dir" fetch --depth 1 origin 592f215f852e3957da01b2b15024dc63713a462e
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "592f215f852e3957da01b2b15024dc63713a462e"
          llvm_prefix="$(brew --prefix llvm@19)"
          cmake -S "$source_dir/obfuscator" -B "$RUNNER_TEMP/demo-ollvm-plugin-build" -G Ninja \
            -DLLVM_DIR="$llvm_prefix/lib/cmake/llvm"
          cmake --build "$RUNNER_TEMP/demo-ollvm-plugin-build" --parallel 3
          plugin="$(find "$RUNNER_TEMP/demo-ollvm-plugin-build" -type f \
            \( -name 'Obfuscator.dylib' -o -name 'Obfuscator.so' \) -print -quit)"
          test -n "$plugin"
          test -f "$plugin"
          echo "DEMO_OLLVM_PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "DEMO_OLLVM_CLANG=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "DEMO_OLLVM_CLANGXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"

      - name: Preflight LLVM19 resource headers for Objective-C
        run: |
          set -euo pipefail
          resource_dir="$("$DEMO_OLLVM_CLANG" -print-resource-dir)"
          test -f "$resource_dir/include/stddef.h"
          test -f "$resource_dir/include/__stddef_max_align_t.h"
          echo "LLVM19 builtin resource directory: $resource_dir"
          printf '%s\n' "$resource_dir" > "$RUNNER_TEMP/demo-ollvm-resource-dir.txt"
          mkdir -p "$RUNNER_TEMP/demo-ollvm-llvm19-modules"
          # Fail early and clearly if LLVM19 cannot consume the selected SDK.
          "$DEMO_OLLVM_CLANG" -resource-dir "$resource_dir" \
            -target arm64-apple-ios11.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -fobjc-arc -fmodules \
            -fmodules-cache-path="$RUNNER_TEMP/demo-ollvm-llvm19-modules" \
            -x objective-c -fsyntax-only - <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          void dd_demo_llvm19_headers(NSString *s) { (void)s; }
          OBJC

      - name: Build demo with OLLVM scoped only to CranePrefs credits
        run: |
          set -euo pipefail
          python3 scripts/demo_ollvm/prepare.py \
            --source demo/reconstruction --dest "$RUNNER_TEMP/crane-demo-ollvm" \
            --variant ollvm --scheme "${{ matrix.scheme }}" --plugin "$DEMO_OLLVM_PLUGIN"
          mkdir -p "$RUNNER_TEMP/demo-expanded-ollvm" "$RUNNER_TEMP/demo-control-ollvm"
          cd "$RUNNER_TEMP/crane-demo-ollvm"
          # Keep all seven targets on Apple Clang, including arm64e.
          # Use LLVM19 + OLLVM ONLY for CRCredits.m on arm64. Homebrew
          # LLVM19 generates arm64e.old, which Apple ld rejects for arm64e.
          export DEMO_APPLE_CLANG="$(xcrun --find clang)"
          export DEMO_OLLVM_RESOURCE_DIR="$(cat "$RUNNER_TEMP/demo-ollvm-resource-dir.txt")"
          export DEMO_OLLVM_MODULE_CACHE="$RUNNER_TEMP/demo-ollvm-llvm19-modules"
          compiler="$GITHUB_WORKSPACE/scripts/demo_ollvm/compiler_select.py"
          chmod +x "$compiler"
          set -o pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            TARGET_CC="$compiler" TARGET_CXX="$(xcrun --find clang++)" \
            TARGET_LD="$(xcrun --find clang++)" \
            2>&1 | tee "$RUNNER_TEMP/demo-comparison/ollvm-build.log"
          selected="$(grep -c '^DEMO_OLLVM_SELECTED: CRCredits.m (arm64) -> LLVM19;' \
            "$RUNNER_TEMP/demo-comparison/ollvm-build.log" || true)"
          bypassed="$(grep -c '^DEMO_OLLVM_BYPASS: CRCredits.m (arm64e) -> Apple Clang;' \
            "$RUNNER_TEMP/demo-comparison/ollvm-build.log" || true)"
          if [ "$selected" -ne 1 ] || [ "$bypassed" -ne 1 ]; then
            echo "::error::Expected one LLVM19 arm64 compile + one Apple Clang arm64e compile; selected=$selected bypassed=$bypassed."
            exit 1
          fi
          deb="$(find packages -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          cp "$deb" "$RUNNER_TEMP/demo-comparison/Crane-demo-${{ matrix.variant }}-ollvm.deb"
          command -v dpkg-deb
          dpkg-deb -x "$deb" "$RUNNER_TEMP/demo-expanded-ollvm"
          dpkg-deb -e "$deb" "$RUNNER_TEMP/demo-control-ollvm"
          test -f "$RUNNER_TEMP/demo-control-ollvm/postinst"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          python3 "$GITHUB_WORKSPACE/scripts/demo_ollvm/verify_install.py" \
            --sandbox "$RUNNER_TEMP/crane-demo-ollvm" \
            --payload "$RUNNER_TEMP/demo-expanded-ollvm" \
            --control "$RUNNER_TEMP/demo-control-ollvm" --scheme "${{ matrix.scheme }}"
          if [ "${{ matrix.scheme }}" = roothide ]; then
            python3 "$GITHUB_WORKSPACE/demo/reconstruction/tools/verify_package_layout.py" \
              "$RUNNER_TEMP/demo-expanded-ollvm" "$RUNNER_TEMP/demo-control-ollvm"
            python3 "$GITHUB_WORKSPACE/demo/reconstruction/tools/verify_helper_entitlements.py" \
              "$RUNNER_TEMP/demo-expanded-ollvm" roothide
          fi
          python3 "$GITHUB_WORKSPACE/demo/reconstruction/tools/verify_architectures.py" "$RUNNER_TEMP/demo-expanded-ollvm"
          python3 "$GITHUB_WORKSPACE/scripts/demo_ollvm/verify.py" \
            --baseline "$RUNNER_TEMP/demo-expanded-plain" \
            --ollvm "$RUNNER_TEMP/demo-expanded-ollvm" \
            --log "$RUNNER_TEMP/demo-comparison/ollvm-build.log" \
            --report "$RUNNER_TEMP/demo-comparison/report.md" --scheme "${{ matrix.scheme }}"
          cat "$RUNNER_TEMP/demo-comparison/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/demo-comparison/NOT-FOR-PRODUCTION.txt" <<'NOTE'
          The package is a Crane reconstruction OLLVM experiment.
          Bootstrap scheme: ${{ matrix.scheme }} (DEB architecture: ${{ matrix.deb_arch }}).
          Do not install on a primary device or co-install with another Crane build.
          Both .deb packages use the same install paths/package ID: replace one
          with the other only with an explicit rollback plan on a spare device.
          OLLVM runs only on 2 named CranePrefs helper functions (arm64 slice).
          Only install if the device bootstrap's dpkg architecture and scheme match.
          Roothide uses a different bootstrap/ABI namespace than rootless.
          Compilation/pass log checks cannot prove on-device UI correctness.
          NOTE

      - name: Upload demo OLLVM package if every check passed
        uses: actions/upload-artifact@v4
        with:
          name: CraneDemo-OLLVM-${{ matrix.variant }}-EXPERIMENTAL
          path: |
            ${{ runner.temp }}/demo-comparison/Crane-demo-${{ matrix.variant }}-ollvm.deb
            ${{ runner.temp }}/demo-comparison/report.md
            ${{ runner.temp }}/demo-comparison/NOT-FOR-PRODUCTION.txt
          if-no-files-found: error

      - name: Upload build logs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraneDemo-OLLVM-${{ matrix.variant }}-Diagnostics
          path: |
            ${{ runner.temp }}/demo-comparison/baseline-build.log
            ${{ runner.temp }}/demo-comparison/ollvm-build.log
            ${{ runner.temp }}/demo-comparison/report.md
          if-no-files-found: warn
